<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Development Day Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0b0c10;
    --bg-1: #12141a;
    --card: #15171f;
    --card-2: #1b1e28;
    --border: rgba(255,255,255,0.08);
    --divider: rgba(255,255,255,0.10);
    --text: #eef0f5;
    --text-dim: #9aa0ae;
    --accent: #7c9bff;
    --accent-2: #b18aff;
    --break: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 15% 0%, #1a1d29 0%, var(--bg-0) 55%),
                var(--bg-0);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 48px 20px 64px;
    min-height: 100vh;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 36px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.95rem;
    font-weight: 500;
  }
  .agenda {
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .row {
    display: grid;
    grid-template-columns: 120px 1fr;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--card-2); }

  .time {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--accent);
    background: rgba(124,155,255,0.07);
    border-right: 1px solid var(--border);
    padding: 18px 8px;
    white-space: nowrap;
  }

  .sessions {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
  }
  .session {
    padding: 18px 22px;
    border-left: 1px solid var(--divider);
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
  }
  .session:first-child { border-left: none; }

  .session .title {
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.35;
  }
  .session .room {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 5px;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--accent);
    background: rgba(124,155,255,0.10);
    border: 1px solid rgba(124,155,255,0.25);
    border-radius: 6px;
    padding: 3px 9px 3px 7px;
  }
  .session .room svg {
    width: 11px;
    height: 11px;
    flex: none;
    opacity: 0.85;
  }

  .row.plenary .sessions {
    grid-auto-flow: row;
  }
  .row.plenary .session {
    justify-content: center;
    align-items: center;
    text-align: center;
    border-left: none;
  }
  .row.plenary .title {
    font-weight: 700;
    font-size: 1.02rem;
    color: var(--text);
  }
  .row.plenary .room {
    align-self: center;
  }
  .row.plenary .time {
    color: var(--accent-2);
    background: rgba(177,138,255,0.08);
  }

  .row.break {
    background: transparent;
  }
  .row.break .time {
    color: var(--break);
    background: transparent;
    border-right: 1px solid var(--border);
  }
  .row.break .session {
    color: var(--break);
    font-style: italic;
    font-weight: 500;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-left: none;
  }
  .row.break .title { font-weight: 500; color: var(--break); }
  .row.break .room { align-self: center; }
  .row.break:hover { background: rgba(255,255,255,0.02); }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
    .time { border-right: none; border-bottom: 1px solid var(--border); justify-content: flex-start; padding: 10px 16px; }
    .sessions { grid-auto-flow: row !important; }
    .session { border-left: none !important; border-top: 1px solid var(--divider); padding: 14px 16px; }
    .session:first-child { border-top: none; }
    .row.plenary .time { border-right: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Development Day Timetable</h1>
    <div class="subtitle">Full-day schedule</div>
  </header>
  <div class="agenda" id="agenda"></div>
</div>

<script type="application/json" id="agenda-data">
[
  { "time": "10:00", "room": "2516", "title": "Welcome" },

  { "time": "10:20", "room": "4511", "title": "Submitting Your Best Work - Kerith George-Briant" },
  { "time": "10:20", "room": "4510", "title": "Using AI at University – Salma ElSayed" },
  { "time": "10:20", "room": "4506", "title": "Guest talk from Lloyds Bank: 'Cyber Defence: Skills in Action'" },

  { "time": "11:10", "room": "4511", "title": "Submitting Your Best Work - Kerith George-Briant" },
  { "time": "11:10", "room": "4510", "title": "Using AI at University – Salma ElSayed" },
  { "time": "11:10", "room": "4506", "title": "Guest talk from Lloyds Bank: 'Cyber Defence: Skills in Action'" },

  { "time": "12:00", "room": null, "title": "Break" },

  { "time": "13:00", "room": "4511", "title": "Graduate Careers – Careers" },
  { "time": "13:00", "room": "4510", "title": "Further Study Opportunities – Jamie O'hare" },
  { "time": "13:00", "room": "4506", "title": "From Classroom to Career: Office 365 in Action - Karl Van Der Schyff" },

  { "time": "13:50", "room": "4511", "title": "Internships – Careers" },
  { "time": "13:50", "room": "4510", "title": "Further Study Opportunities – Jamie O'hare" },
  { "time": "13:50", "room": "4506", "title": "From Classroom to Career: Office 365 in Action - Karl Van Der Schyff" },

  { "time": "14:40", "room": null, "title": "Break" },

  { "time": "15:00", "room": "2516", "title": "EH + CYB Fireside Chat" },
  { "time": "15:00", "room": "2517", "title": "Computing + CompSci Activity" },

  { "time": "16:00", "room": "1502 - Events Space", "title": "Pizza Party" }
]
</script>

<script>
  const data = JSON.parse(document.getElementById('agenda-data').textContent);
  const BREAK_WORDS = ['break'];

  // group consecutive entries that share the same time
  const groups = [];
  for (const entry of data) {
    const last = groups[groups.length - 1];
    if (last && last.time === entry.time) {
      last.items.push(entry);
    } else {
      groups.push({ time: entry.time, items: [entry] });
    }
  }

  const agenda = document.getElementById('agenda');

  for (const group of groups) {
    const isBreak = group.items.length === 1 &&
      BREAK_WORDS.some(w => group.items[0].title.toLowerCase().includes(w));
    const isPlenary = !isBreak && group.items.length === 1;

    const row = document.createElement('div');
    row.className = 'row' + (isBreak ? ' break' : isPlenary ? ' plenary' : '');

    const timeEl = document.createElement('div');
    timeEl.className = 'time';
    timeEl.textContent = group.time;
    row.appendChild(timeEl);

    const sessions = document.createElement('div');
    sessions.className = 'sessions';

    for (const item of group.items) {
      const session = document.createElement('div');
      session.className = 'session';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = item.title;
      session.appendChild(title);

      if (item.room) {
        const room = document.createElement('div');
        room.className = 'room';
        room.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span></span>';
        room.querySelector('span').textContent = item.room;
        session.appendChild(room);
      }

      sessions.appendChild(session);
    }

    row.appendChild(sessions);
    agenda.appendChild(row);
  }
</script>
</body>
</html>
